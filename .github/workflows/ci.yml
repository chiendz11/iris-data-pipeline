name: data-pipeline-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: pytest -q
      - name: Reproduce pipeline without remote registry
        env:
          REGISTER_MODEL: "false"
          MLFLOW_TRACKING_URI: file:./mlruns
        run: dvc repro
      - name: Build training image
        run: docker build -t iris-training:${{ github.sha }} .
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/iris-training:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/iris-training:latest

