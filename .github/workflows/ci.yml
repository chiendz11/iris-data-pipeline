name: data-pipeline-ci

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "params.yaml"
      - "dvc.yaml"
      - "dvc.lock"
      - "Dockerfile"
      - "requirements*.txt"
      - "pyproject.toml"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -e .
      - run: ruff check src tests
      - run: python -m pytest -q
      - name: Reproduce pipeline without remote registry
        env:
          REGISTER_MODEL: "false"
          MLFLOW_TRACKING_URI: file:./mlruns
        run: dvc repro
      - name: Build image locally
        run: docker build -t iris-training:${{ github.sha }} .

  publish-data:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.TRAINING_ECR_REPOSITORY }}
      DVC_BUCKET: ${{ vars.DVC_BUCKET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -e .
      - name: Build immutable training image
        run: docker build -t iris-training:${{ github.sha }} .
      - name: Assume AWS deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Publish immutable training image
        run: |
          docker tag iris-training:${{ github.sha }} "${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ github.sha }}"
          docker push "${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ github.sha }}"
      - name: Push DVC cache to S3
        run: |
          dvc remote modify aws url "s3://${DVC_BUCKET}/dvc-cache"
          dvc push
      - name: Publish dataset object and trigger Argo
        run: |
          LOCK_SHA="$(sha256sum dvc.lock | cut -d' ' -f1)"
          aws s3 cp data/iris.csv "s3://${DVC_BUCKET}/datasets/${{ github.sha }}/iris.csv" \
            --metadata "git-sha=${{ github.sha }},dvc-lock-sha=${LOCK_SHA}"
