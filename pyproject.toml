[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-data-pipeline"
version = "0.1.0"
description = "Small reproducible Iris training pipeline for an MLOps capstone"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mlflow>=3.5,<4",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

