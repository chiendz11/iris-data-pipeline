stages:
  prepare:
    cmd: python -m iris_pipeline.data.prepare
    deps:
      - src/iris_pipeline/data/prepare.py
    outs:
      - data/iris.csv
  train:
    cmd: python -m iris_pipeline.training.train
    deps:
      - data/iris.csv
      - src/iris_pipeline/contracts/model_result.py
      - src/iris_pipeline/evaluation/offline.py
      - src/iris_pipeline/training/config.py
      - src/iris_pipeline/training/model.py
      - src/iris_pipeline/training/train.py
    params:
      - data
      - model
      - quality_gate
    metrics:
      - metrics.json:
          cache: false
    outs:
      - outputs/model-result.json:
          cache: false
